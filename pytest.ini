# home-network-mcp/pytest.ini
#
# pytest configuration.
# asyncio_mode = "auto" means every async test function is automatically treated
# as an asyncio test — no need to add @pytest.mark.asyncio to each one, though
# we keep the markers for explicitness.
#
# Docs: https://pytest-asyncio.readthedocs.io/en/latest/reference/modes/

[pytest]
asyncio_mode = auto
